name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libusb-1.0-0
      - run: uv sync --locked --extra dev --extra gui
      - name: Unit and simulated tests
        run: uv run pytest tests/unit tests/simulated -v
      - name: Integration tests (MCP stdio/HTTP, GUI offscreen, CLI, packaging)
        run: uv run pytest tests/integration -v
      # Hardware tests (tests/hardware, marker "hardware") are never run in CI.

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  windows-installer:
    name: Windows install script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scripts/install_windows.ps1 (no GUI)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/install_windows.ps1 -NoGui
      - name: Launcher scripts resolve the venv
        shell: cmd
        run: |
          .venv\Scripts\hantek-mcp.exe --version
          .venv\Scripts\hantek-mcp.exe capture --simulate --measure voltage
